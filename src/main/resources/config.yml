# ======================================================================================
#  MagicReset
#  Everything here can also be changed in-game: /mr opens the menu.
#  After editing this file by hand: /mr reload
# ======================================================================================

reset:
  # Seconds before everybody is moved to the limbo, and in the limbo once the new world is ready.
  countdown: 5
  limbo-countdown: 5
  # Start a new run on its own: OFF, DEATH (a death ends the run; with shared lives the last one),
  # GOAL (goal reached / manhunt decided) or BOTH. auto-delay = seconds until then.
  auto: 'OFF'
  auto-delay: 10
  # What happens to every player when a new run starts.
  player:
    clear-inventory: true
    clear-ender-chest: true
    reset-health: true
    reset-hunger: true
    reset-experience: true
    clear-effects: true
    revoke-advancements: true
    revoke-recipes: false
    reset-respawn-point: true
    game-mode: SURVIVAL

seed:
  # RANDOM = a new seed every reset, FIXED = always the seed below.
  mode: RANDOM
  fixed: ''
  # Show the seed to players (admins always see it with /mr seed).
  show: true

backups:
  # Keep a copy of the old worlds in plugins/MagicReset/backups (the last 5 resets).
  enabled: true

worlds:
  # Nether and end are part of the game (and reset with it).
  nether: true
  end: true
  # NORMAL, FLAT, LARGE_BIOMES or AMPLIFIED
  type: NORMAL
  # PEACEFUL, EASY, NORMAL or HARD
  difficulty: NORMAL
  generate-structures: true
  # World border diameter in blocks, 0 = no border.
  world-border: 0
  # Game rules for every new world, e.g.  minecraft:keep_inventory: true
  game-rules: {}
  # The vanilla locator bar (other players above the hotbar).
  locator-bar: true

timer:
  # false = no timer at all.
  enabled: true
  # RTA = real time, IGT = in-game time (only counts while the server runs the game).
  mode: RTA
  # AUTO = when the run starts, FIRST_INPUT = on the first movement, MANUAL = /mr timer start
  start: AUTO
  # Stop the timer while nobody is online.
  stop-when-empty: false
  # Stop the timer while a player is dead, continue on respawn.
  pause-while-dead: false
  # "auto" (1:02:03.45) or a pattern like HH:mm:ss or mm:ss.SSS
  format: auto

goal:
  # NONE, BEAT_GAME, KILL_ENTITY, ENTER_DIMENSION, ADVANCEMENT, BREAK_BLOCK, OBTAIN_ITEM, FIND_BIOME, FIND_STRUCTURE
  type: BEAT_GAME
  # The mob, dimension, advancement, block, item, biome or structure, e.g. minecraft:ender_dragon
  target: ''
  amount: 1

deaths:
  # OFF = deaths are only counted, HARDCORE = the first death ends the run, SHARED_LIVES = everybody shares the lives
  mode: 'OFF'
  shared-lives: 3

manhunt:
  # Targets run, everybody else hunts them (/manhunt). The goal above is what the targets have to do.
  enabled: false
  target-lives: 1
  # Seconds the hunters have to wait at the start.
  head-start: 30
  hunter-compass: true

sidebar:
  # The scoreboard on the right side (time, goal, deaths; the leaderboard in the limbo).
  enabled: true

# Do not change: used to update this file when MagicReset changes it.
config-version: 3
