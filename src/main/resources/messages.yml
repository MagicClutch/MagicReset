  date-format: 'dd.MM.yy'
  chat-header: '<prefix><gray>Best times for the current goal:'
  new-record: '<prefix><gold><bold>New record!</bold></gold> <white><player></white> <gray>in</gray> <white><time></white>'
  new-entry: '<prefix><white><player></white> <gray>is now <white>#<rank></white> on the leaderboard with</gray> <white><time></white>'
  cleared: '<prefix><gray>Leaderboard for <white><goal></white> cleared.'

worlds:
