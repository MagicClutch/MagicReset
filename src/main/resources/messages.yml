# ======================================================================================
#  MagicReset - messages
#  Format: MiniMessage (https://docs.advntr.dev/minimessage/format.html)
#  <prefix> can be used in every message. An empty message ('') is not sent.
# ======================================================================================

prefix: '<gradient:#a855f7:#6366f1><bold>MagicReset</bold></gradient> <dark_gray>»</dark_gray> '

players-only: '<prefix><red>Only players can use this command.'
invalid-duration: '<prefix><red>Invalid time. Examples: <white>90</white>, <white>45s</white>, <white>1h30m</white>, <white>1:02:03.5</white>'
reloaded: '<prefix><green>Configuration and messages reloaded.'
reload-warning: '<prefix><yellow><warning>'

dimension:
  overworld: 'Overworld'
  the-nether: 'Nether'
  the-end: 'End'

reset:
  started: '<prefix><gray>Resetting the world... <dark_gray>(deleting <worlds>)'
  ready: '<prefix><green>The new world is ready. <gray>Seed: <white><seed>'
  ready-no-seed: '<prefix><green>The new world is ready.'
  failed: '<prefix><red>The reset failed: <white><reason></white>. Everyone stays in limbo, try <white>/magicreset reset</white> again.'
  already-resetting: '<prefix><red>A reset is already in progress.'
  countdown-started: '<prefix><gray>The world resets in <white><seconds></white> seconds. <dark_gray>(/magicreset cancel)'

countdown:
  none: '<prefix><red>There is no countdown to cancel.'
  cancelled: '<prefix><yellow>The countdown was cancelled.'
  reset:
    title: '<gradient:#a855f7:#6366f1><bold><seconds></bold></gradient>'
    subtitle: '<gray>World reset'
    chat: '<prefix><gray>World reset in <white><seconds></white>...'
  start:
    title: '<green><bold><seconds></bold>'
    subtitle: '<gray>Get ready!'
    chat: ''
  pause:
    title: '<yellow><bold><seconds></bold>'
    subtitle: '<gray>Pausing the run'
    chat: '<prefix><gray>Pausing in <white><seconds></white>...'
  resume:
    title: '<green><bold><seconds></bold>'
    subtitle: '<gray>The run continues'
    chat: ''

bossbar:
  moving: '<light_purple>Moving everyone to limbo...'
  deleting: '<light_purple>Deleting the old world...'
  generating: '<aqua>Generating the <dimension>...'
  spawn: '<aqua>Looking for a safe spawn...'
  ready: '<green>The new world is ready!'
  paused: '<yellow>The run is paused'
  failed: '<red>The reset failed - waiting for an admin'

title:
  go: '<gradient:#22c55e:#10b981><bold>GO!</bold></gradient>'
  go-subtitle: '<gray>Goal: <white><goal>'
  resumed: '<green><bold>Resumed'
  completed: '<gold><bold>Goal complete!'
  completed-subtitle: '<white><player></white> <gray>in</gray> <white><time>'
  failed: '<red><bold>Run failed'
  failed-subtitle: '<white><player></white> <gray>died after</gray> <white><time>'

pause:
  paused: '<prefix><yellow>The run is paused. <gray>Your progress is saved.'
  resumed: '<prefix><green>The run continues!'
  already-paused: '<prefix><red>The run is already paused.'
  not-running: '<prefix><red>There is no running game to pause right now.'
  not-paused: '<prefix><red>The run is not paused.'
  no-world: '<prefix><red>There is no game world to return to. Use <white>/magicreset reset</white>.'

goal:
  current: '<prefix><gray>Goal: <white><goal></white> <dark_gray>(<progress>)'
  changed: '<prefix><green>New goal: <white><goal>'
  invalid-entity: '<prefix><red><target> is not a living entity.'
  invalid-dimension: '<prefix><red><target> is not a dimension.'
  invalid-advancement: '<prefix><red><target> is not an advancement.'
  invalid-block: '<prefix><red><target> is not a block.'
  invalid-item: '<prefix><red><target> is not an item.'
  completed:
    global: '<prefix><gold><bold><player></bold></gold> <gray>completed the goal in</gray> <white><time></white><gray>!'
    individual: '<prefix><gold><player></gold> <gray>finished in</gray> <white><time></white><gray>!'
    all: '<prefix><green>Everyone has finished!'
  describe:
    none: 'None'
    beat-game: 'Beat Minecraft'
    kill-entity: 'Kill <count><target>'
    enter-dimension: 'Enter the <target>'
    advancement: 'Get <target>'
    break-block: 'Mine <count><target>'
    obtain-item: 'Collect <count><target>'

deaths:
  life-lost: '<prefix><red><player></red> <gray>died. Lives left: <white><lives>'
  failed: '<prefix><red><bold>Run failed!</bold></red> <gray><player> died after <white><time></white>.'
  status-off: '<prefix><gray>Death rules: <white>off</white> <dark_gray>(<deaths> deaths this run)'
  status-hardcore: '<prefix><gray>Death rules: <red>hardcore</red> <dark_gray>- the first death fails the run'
  status-lives: '<prefix><gray>Death rules: <white>shared lives</white> <dark_gray>- <lives>/<max> left'

seed:
  current: '<prefix><gray>Current seed: <white><seed></white> <dark_gray>(next reset: <mode>)'
