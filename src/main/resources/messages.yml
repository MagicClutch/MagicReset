  not-loaded: 'not loaded'
  footer: '<dark_gray>Toggle with /magicreset worlds nether|end on|off. The server''s main overworld (minecraft:overworld) cannot be unloaded while the server runs, so <key> is used as the game overworld.'
  you-are-in: '<gray>You are in <white><key></white>.'

