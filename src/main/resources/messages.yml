  hidden: 'hidden'
  show-on: '<prefix><green>The seed is shown to everyone again.'
  show-off: '<prefix><gray>The seed is now hidden (only admins with /magicreset seed can see it).'
  mode-random: '<prefix><green>Every reset now uses a random seed.'
  mode-fixed: '<prefix><green>Every reset now uses the seed <white><seed></white>.'
  copied: '<prefix><green>The current seed <white><seed></white> is now the fixed seed.'

timer:
  started: '<prefix><green>Timer started.'
  paused: '<prefix><yellow>Timer paused.'
  resumed: '<prefix><green>Timer resumed.'
  reset: '<prefix><gray>Timer reset.'
  set: '<prefix><gray>Timer set to <white><time></white>.'
  mode-changed: '<prefix><gray>Timer mode: <white><mode>'
  scope-changed: '<prefix><gray>Timer scope: <white><scope>'
  trigger-changed: '<prefix><gray>Timer start: <white><trigger>'
  format-current: '<prefix><gray>Time format: <white><format></white> <dark_gray>(example: <example>)'
  format-changed: '<prefix><green>Time format set to <white><format></white> <dark_gray>(example: <example>)'
  format-invalid: '<prefix><red>Use auto or a pattern with H (hours), m (minutes), s (seconds), S (fractions), e.g. <white>HH:mm:ss</white> or <white>mm:ss.SSS</white>.'
