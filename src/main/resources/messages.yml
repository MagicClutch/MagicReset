  hidden: 'hidden'
  show-on: '<prefix><green>The seed is shown to everyone again.'
  show-off: '<prefix><gray>The seed is now hidden (only admins with /magicreset seed can see it).'
  mode-random: '<prefix><green>Every reset now uses a random seed.'
  mode-fixed: '<prefix><green>Every reset now uses the seed <white><seed></white>.'
  copied: '<prefix><green>The current seed <white><seed></white> is now the fixed seed.'

timer:
  started: '<prefix><green>Timer started.'
  paused: '<prefix><yellow>Timer paused.'
  resumed: '<prefix><green>Timer resumed.'
  reset: '<prefix><gray>Timer reset.'
  set: '<prefix><gray>Timer set to <white><time></white>.'
  mode-changed: '<prefix><gray>Timer mode: <white><mode>'
  scope-changed: '<prefix><gray>Timer scope: <white><scope>'
  trigger-changed: '<prefix><gray>Timer start: <white><trigger>'
  format-current: '<prefix><gray>Time format: <white><format></white> <dark_gray>(example: <example>)'
  format-changed: '<prefix><green>Time format set to <white><format></white> <dark_gray>(example: <example>)'
  format-invalid: '<prefix><red>Use auto or a pattern with H (hours), m (minutes), s (seconds), S (fractions), e.g. <white>HH:mm:ss</white> or <white>mm:ss.SSS</white>.'
  stop-when-empty-on: '<prefix><green>The timer now stops while nobody is playing.'
  stop-when-empty-off: '<prefix><gray>The timer keeps running while nobody is playing.'
  status: '<prefix><gray>Timer <white><state></white> <dark_gray>|</dark_gray> RTA <white><rta></white> <dark_gray>|</dark_gray> IGT <white><igt></white> <dark_gray>|</dark_gray> showing <white><mode></white>, <white><scope></white>, start <white><trigger>'

hud:
  separator: '  <dark_gray>|</dark_gray>  '
  resetting: '<light_purple>Generating a new world...'
  paused: '<yellow>⏸ Paused</yellow> <gray><time>'
  timer:
    running: '<gradient:#facc15:#f97316><bold><time></bold></gradient>'
    paused: '<yellow>⏸ <bold><time></bold>'
    paused-move: '<yellow>⏸ <bold><time></bold> <gray>- move to continue'
    finished: '<green>✔ <bold><time></bold>'
    failed: '<red>✘ <bold><time></bold>'
    waiting: '<gray>Move to start the timer'
    idle: '<gray><bold><time></bold>'

locator-bar:
  enabled: '<prefix><green>Locator bar enabled in the game worlds.'
  disabled: '<prefix><gray>Locator bar disabled in the game worlds.'

scoreboard:
  shown: '<prefix><green>Sidebar shown.'
  hidden: '<prefix><gray>Sidebar hidden.'
  title: '<gradient:#a855f7:#6366f1><bold>MagicReset</bold></gradient>'
  status:
    resetting: '<light_purple>Resetting'
    paused: '<yellow>Paused'
    running: '<green>Running'
    completed: '<gold>Completed'
    failed: '<red>Failed'
  role:
    target: '<gold>Target'
    hunter: '<red>Hunter'
    spectator: '<gray>Spectator'
  # used while manhunt mode is on
  manhunt-lines:
    - '<dark_gray>Run #<run>'
    - ''
    - '<gray>Time <white><time>'
    - '<gray>You are <role>'
    - ' '
    - '<gray>Targets'
    - '<white><targets>'
    - '<gray>Targets win with'
    - '<white><goal>'
  lines:
    - '<dark_gray>Run #<run>'
    - ''
    - '<gray>Time <white><time>'
    - '<gray>Status <status>'
    - ' '
    - '<gray>Goal'
    - '<white><goal>'
    - '<gray>Progress <white><progress>'
    - '  '
    - '<gray>Deaths <white><deaths>'
    - '<gray>Lives <white><lives>'
    - '<gray>Players <white><players>'

