name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MagicReset
          path: build/libs/*.jar
          if-no-files-found: error

  # Every push to main replaces the "latest" pre-release, so the newest jar is always one click away.
  latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-release
      cancel-in-progress: true
    steps:
      - name: Download plugin jar
        uses: actions/download-artifact@v4
        with:
          name: MagicReset
          path: dist

      - name: Publish latest build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.jar \
            --title "Latest build" \
            --notes "Automatic build of main at ${GITHUB_SHA::7}. For tested versions use the numbered releases." \
            --prerelease \
            --target "$GITHUB_SHA"

  # Pushing a tag like v1.0.0 publishes a numbered release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin jar
        uses: actions/download-artifact@v4
        with:
          name: MagicReset
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
